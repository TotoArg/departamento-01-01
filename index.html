  <title>Departamento 01-01 | Plano 2D y 3D Exacto</title>

      color: #f8fafc;

      height: 100vh;
    }
    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);

    button {
      background: #1e293b; border: 1px solid #475569; color: #f8fafc;
      padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600;
    }
    button.active { background: #0284c7; border-color: #38bdf8; color: white; }

    #container-2d {
      width: 100vw; height: 100vh; display: flex;
      justify-content: center; align-items: center; background: #0b1120;
      padding: 60px 16px 16px;
    }
    .card-2d {
      background: #ffffff;
      border-radius: 32px;
      padding: 12px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75);
      max-width: 94vw;
      max-height: 86vh;
      display: flex;
    }
    .card-2d svg { width: auto; height: 82vh; max-width: 90vw; display: block; }
    #container-3d { width: 100vw; height: 100vh; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

</head>
