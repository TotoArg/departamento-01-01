<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departamento 01-01 | Plano 2D y 3D Interactivo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #0b1120; color: #f8fafc; overflow: hidden; height: 100vh; }
    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title-group { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 16px; font-weight: 700; color: #f8fafc; }
    .badge { font-size: 11px; background: #0284c7; color: white; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
    .nav-buttons { display: flex; gap: 8px; }
    button {
      background: #1e293b; border: 1px solid #475569; color: #f8fafc;
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.2s ease;
    }
    button:hover { background: #334155; border-color: #38bdf8; }
    button.active { background: #0284c7; border-color: #38bdf8; color: white; }
    #container-3d { width: 100vw; height: 100vh; display: block; }
    #container-2d {
      width: 100vw; height: 100vh; display: none;
      justify-content: center; align-items: center; background: #0f172a;
      overflow: auto; padding: 60px 20px 20px;
    }
    #container-2d svg { max-width: 90vw; max-height: 85vh; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .hint-3d {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(6px);
      padding: 6px 16px; border-radius: 999px; font-size: 12px; color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Departamento 01-01</h1>
      <span class="badge">Área: 40.85 m²</span>
    </div>
    <div class="nav-buttons">
      <button id="btn-3d" class="active" onclick="switchView('3d')">🎮 Vista 3D</button>
      <button id="btn-2d" onclick="switchView('2d')">📐 Plano 2D Técnico</button>
      <button onclick="resetCamera()">⟲ Centrar</button>
    </div>
  </header>

  <div id="container-3d"></div>
  <div class="hint-3d" id="hint-3d">Click izquierdo + arrastrar: rotar • Rueda: zoom • Click derecho: desplazar</div>

  <div id="container-2d">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 980" style="background-color: #0f172a;">
      <defs>
        <pattern id="wood" width="40" height="10" patternUnits="userSpaceOnUse">
          <rect width="40" height="10" fill="none" stroke="#d97706" stroke-width="0.3" stroke-opacity="0.15" />
        </pattern>
        <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <line x1="1" y1="9" x2="9" y2="1" stroke="#38bdf8" stroke-width="1.8"/>
        </marker>
      </defs>
      
      <g transform="translate(130, 100)">
        <rect x="0" y="0" width="280" height="280" fill="#1e293b"/>
        <rect x="0" y="280" width="280" height="50" fill="#2e1065"/>
        <rect x="0" y="330" width="280" height="90" fill="#0c4a6e"/>
        <rect x="0" y="420" width="280" height="80" fill="#2e1065"/>
        <rect x="0" y="500" width="350" height="200" fill="#1e293b"/>
        <rect x="280" y="280" width="70" height="220" fill="#1e293b"/>
        <rect x="350" y="500" width="220" height="200" fill="#1e293b"/>
        <polygon points="350,0 630,0 630,570 570,570 570,500 350,500" fill="#1e293b"/>

        <text x="140" y="145" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">ESTUDIO (7.84 m²)</text>
        <text x="140" y="310" fill="#c084fc" font-size="9" font-weight="600" text-anchor="middle">PLACARD SUP. (1.40 m²)</text>
        <text x="140" y="380" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">BAÑO COMPLETO (2.52 m²)</text>
        <text x="140" y="465" fill="#c084fc" font-size="9" font-weight="600" text-anchor="middle">PLACARD INF. (2.24 m²)</text>
        <text x="175" y="610" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">DORMITORIO (7.00 m²)</text>
        <text x="490" y="250" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">LIVING - COMEDOR (14.00 m²)</text>
        <text x="460" y="605" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">COCINA (4.40 m²)</text>
        <text x="600" y="535" fill="#10b981" font-size="10" font-weight="700" text-anchor="middle">HALL ACCESO</text>

        <g stroke="#f59e0b" stroke-width="2" fill="none">
          <line x1="280" y1="280" x2="280" y2="350"/>
          <path d="M 350 280 A 70 70 0 0 1 280 350" stroke-dasharray="3,3"/>
          <line x1="280" y1="415" x2="210" y2="415"/>
          <path d="M 280 340 A 75 75 0 0 1 210 415" stroke-dasharray="3,3"/>
          <line x1="280" y1="500" x2="280" y2="570"/>
          <path d="M 350 500 A 70 70 0 0 1 280 570" stroke-dasharray="3,3"/>
          <line x1="625" y1="570" x2="625" y2="480" stroke="#10b981"/>
          <path d="M 535 570 A 90 90 0 0 1 625 480" stroke="#10b981" stroke-dasharray="3,3"/>
        </g>

        <path d="M -6 -6 L 636 -6 L 636 576 L 576 576 L 576 706 L -6 706 Z M 0 0 L 0 700 L 570 700 L 570 570 L 630 570 L 630 0 Z" fill="#334155" fill-rule="evenodd"/>
        
        <rect x="275" y="0" width="10" height="280" fill="#475569"/>
        <rect x="0" y="275" width="280" height="10" fill="#475569"/>
        <rect x="0" y="325" width="280" height="10" fill="#475569"/>
        <rect x="0" y="415" width="280" height="10" fill="#475569"/>
        <rect x="0" y="495" width="280" height="10" fill="#475569"/>
        <rect x="345" y="500" width="10" height="200" fill="#475569"/>
        <rect x="435" y="495" width="135" height="10" fill="#475569"/>

        <line x1="0" y1="-30" x2="630" y2="-30" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)"/>
        <text x="315" y="-36" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="600">6.30 m</text>
        <line x1="-30" y1="0" x2="-30" y2="700" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#tick)" marker-end="url(#tick)"/>
        <text x="-38" y="350" fill="#38bdf8" font-size="12" text-anchor="middle" font-weight="600" transform="rotate(-90 -38 350)">7.00 m</text>
      </g>
    </svg>
  </div>

  <script>
    let scene, camera, renderer, controls;
    const container3D = document.getElementById('container-3d');
    const container2D = document.getElementById('container-2d');
    const hint3D = document.getElementById('hint-3d');

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1120);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(3.15, 12, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container3D.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(3.15, 0, 3.5);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 15, 8);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
      const floorWoodMat = new THREE.MeshStandardMaterial({ color: 0x92400e, roughness: 0.5 });
      const floorTileMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
      const floorDarkMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.4 });

      function addFloor(x, z, w, d, mat) {
        const geo = new THREE.PlaneGeometry(w, d);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set(x + w / 2, 0, z + d / 2);
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      addFloor(0, 0, 2.8, 2.8, floorWoodMat);      // Estudio
      addFloor(0, 2.8, 2.8, 0.5, floorDarkMat);    // Placard Sup
      addFloor(0, 3.3, 2.8, 0.9, floorTileMat);    // Baño
      addFloor(0, 4.2, 2.8, 0.8, floorDarkMat);    // Placard Inf
      addFloor(0, 5.0, 3.5, 2.0, floorWoodMat);    // Cuarto
      addFloor(2.8, 2.8, 0.7, 2.2, floorWoodMat);  // Pasillo
      addFloor(3.5, 5.0, 2.2, 2.0, floorTileMat);  // Cocina
      addFloor(3.5, 0, 2.8, 5.0, floorWoodMat);    // Living
      addFloor(5.7, 5.0, 0.6, 0.7, floorWoodMat);  // Foyer

      const H = 2.4;
      function addWall(x, z, w, d) {
        const geo = new THREE.BoxGeometry(w, H, d);
        const mesh = new THREE.Mesh(geo, wallMat);
        mesh.position.set(x + w / 2, H / 2, z + d / 2);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      const T = 0.15;
      // Perímetro en "L"
      addWall(0, 0, 6.3, T);                       // Norte
      addWall(0, 0, T, 7.0);                       // Oeste
      addWall(6.3 - T, 0, T, 5.7);                 // Este
      addWall(5.7, 5.7 - T, 0.6, T);               // Palier
      addWall(5.7 - T, 5.7, T, 1.3);               // Cocina lateral ext
      addWall(0, 7.0 - T, 5.7, T);                 // Sur base

      // Tabiques Interiores
      addWall(2.8, 0, T, 2.8);
      addWall(0, 2.8, 2.8, T);
      addWall(0, 3.3, 2.8, T);
      addWall(0, 4.2, 2.8, T);
      addWall(0, 5.0, 2.8, T);
      addWall(2.8, 2.8, T, 0.6);
      addWall(2.8, 4.15, T, 0.85);
      addWall(3.5, 5.0, T, 2.0);
      addWall(4.35, 5.0, 1.35, T);

      const grid = new THREE.GridHelper(14, 14, 0x38bdf8, 0x1e293b);
      grid.position.set(3.15, -0.01, 3.5);
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function resetCamera() {
      camera.position.set(3.15, 12, 10);
      controls.target.set(3.15, 0, 3.5);
    }

    function switchView(mode) {
      document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
      document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
      if (mode === '3d') {
        container3D.style.display = 'block';
        hint3D.style.display = 'block';
        container2D.style.display = 'none';
      } else {
        container3D.style.display = 'none';
        hint3D.style.display = 'none';
        container2D.style.display = 'flex';
      }
    }

    window.onload = init3D;
  </script>
</body>
</html>
