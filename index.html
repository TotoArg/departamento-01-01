<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Departamento 01-01 | Plano 2D y 3D Exacto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
    }

    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px);
      padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title-group { display: flex; align-items: center; gap: 12px; }
    h1 { font-size: 16px; font-weight: 700; color: #f8fafc; }
    .badge { font-size: 11px; background: #0284c7; color: white; padding: 4px 10px; border-radius: 999px; font-weight: 600; }

    .nav-buttons { display: flex; gap: 8px; }
    button {
      background: #1e293b; border: 1px solid #475569; color: #f8fafc;
      padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600;
      transition: all 0.2s ease;
    }
    button:hover { background: #334155; border-color: #38bdf8; }
    button.active { background: #0284c7; border-color: #38bdf8; color: white; }

    /* Contenedor 2D (Visible por defecto, idéntico a la imagen) */
    #container-2d {
      width: 100vw; height: 100vh; display: flex;
      justify-content: center; align-items: center; background: #0f172a;
      overflow: auto; padding: 64px 20px 20px;
    }
    .card-2d {
      background: #ffffff;
      border-radius: 36px;
      padding: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      max-width: 92vw;
      max-height: 86vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-2d svg {
      width: auto;
      height: 82vh;
      max-width: 88vw;
      display: block;
    }

    /* Contenedor 3D */
    #container-3d { width: 100vw; height: 100vh; display: none; }
    .hint-3d {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
      padding: 6px 16px; border-radius: 999px; font-size: 12px; color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1); pointer-events: none; display: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <header>
    <div class="title-group">
      <h1>Departamento 01-01</h1>
      <span class="badge">6.30 m × 7.00 m</span>
    </div>
    <div class="nav-buttons">
      <button id="btn-2d" class="active" onclick="switchView('2d')">📐 Plano 2D Exacto</button>
      <button id="btn-3d" onclick="switchView('3d')">🎮 Maqueta 3D</button>
    </div>
  </header>

  <!-- VISTA 2D: RÉPLICA 1:1 DE LA IMAGEN -->
  <div id="container-2d">
    <div class="card-2d">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 800">
        <!-- Cotas exteriores -->
        <text x="365" y="32" font-size="14" font-weight="600" fill="#495057" text-anchor="middle">6.30 m</text>
        <text x="26" y="400" font-size="14" font-weight="600" fill="#495057" text-anchor="middle" transform="rotate(-90 26 400)">7.00 m</text>

        <!-- Rincón exterior del Palier Edificio (gris claro abajo a la derecha) -->
        <rect x="570" y="620" width="110" height="130" fill="#e9ecef"/>
        <text x="625" y="678" font-size="11" font-weight="700" fill="#868e96" text-anchor="middle">PALIER</text>
        <text x="625" y="694" font-size="10" font-weight="700" fill="#868e96" text-anchor="middle">EDIFICIO</text>

        <!-- Perímetro exterior en "L" (con el corte de la puerta de entrada en Y=620) -->
        <polyline points="590,620 570,620 570,750 50,750 50,50 680,50 680,620 660,620" fill="none" stroke="#212529" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>

        <!-- Puerta de Entrada Principal y jambas en Y=620 -->
        <line x1="590" y1="620" x2="660" y2="620" stroke="#ced4da" stroke-width="8"/>
        <line x1="590" y1="608" x2="590" y2="632" stroke="#212529" stroke-width="4"/>
        <line x1="660" y1="608" x2="660" y2="632" stroke="#212529" stroke-width="4"/>

        <!-- BLOQUE IZQUIERDO: Paredes horizontales (X=50 a X=280) -->
        <line x1="50" y1="280" x2="280" y2="280" stroke="#212529" stroke-width="5"/>
        <line x1="50" y1="330" x2="280" y2="330" stroke="#212529" stroke-width="5"/>
        <line x1="50" y1="450" x2="280" y2="450" stroke="#212529" stroke-width="5"/>
        <line x1="50" y1="500" x2="280" y2="500" stroke="#212529" stroke-width="5"/>

        <!-- BLOQUE IZQUIERDO: Paredes verticales en X=280 -->
        <line x1="280" y1="280" x2="280" y2="330" stroke="#212529" stroke-width="5"/>
        <line x1="280" y1="420" x2="280" y2="500" stroke="#212529" stroke-width="5"/>

        <!-- EJE CENTRAL (X=350): Muro sólido de Y=50 a Y=420 -->
        <line x1="350" y1="50" x2="350" y2="420" stroke="#212529" stroke-width="6"/>

        <!-- EJE CENTRAL (X=350): Vano abierto al Living de Y=420 a Y=500 -->
        <line x1="350" y1="420" x2="350" y2="500" stroke="#868e96" stroke-width="2" stroke-dasharray="5,5"/>

        <!-- COCINA: Muros laterales (X=350 y X=570, de Y=500 a Y=750) -->
        <line x1="350" y1="500" x2="350" y2="750" stroke="#212529" stroke-width="6"/>
        <line x1="570" y1="500" x2="570" y2="620" stroke="#212529" stroke-width="6"/>

        <!-- COCINA: Frente en Y=500 (Vano abierto de 350 a 435 + Muro ciego de 435 a 570) -->
        <line x1="350" y1="500" x2="435" y2="500" stroke="#868e96" stroke-width="2" stroke-dasharray="5,5"/>
        <line x1="435" y1="500" x2="570" y2="500" stroke="#212529" stroke-width="6"/>

        <!-- LAS 3 PUERTAS CON SUS ARCOS EXACTOS -->
        <!-- 1. Puerta Estudio (en Y=280, entre X=280 y X=350) -->
        <line x1="280" y1="280" x2="350" y2="280" stroke="#868e96" stroke-width="2.5" stroke-dasharray="4,4"/>
        <path d="M 280 280 Q 305 310 330 280" fill="none" stroke="#212529" stroke-width="2"/>
        <line x1="330" y1="280" x2="330" y2="292" stroke="#212529" stroke-width="1.5"/>

        <!-- 2. Puerta Baño (en X=280, entre Y=330 y Y=420) -->
        <line x1="280" y1="330" x2="280" y2="420" stroke="#868e96" stroke-width="2.5" stroke-dasharray="4,4"/>
        <path d="M 280 330 Q 310 355 280 380" fill="none" stroke="#212529" stroke-width="2"/>
        <line x1="280" y1="380" x2="292" y2="380" stroke="#212529" stroke-width="1.5"/>

        <!-- 3. Puerta Cuarto (en Y=500, entre X=280 y X=350) -->
        <line x1="280" y1="500" x2="350" y2="500" stroke="#868e96" stroke-width="2.5" stroke-dasharray="4,4"/>
        <path d="M 280 500 Q 305 470 330 500" fill="none" stroke="#212529" stroke-width="2"/>
        <line x1="330" y1="500" x2="330" y2="488" stroke="#212529" stroke-width="1.5"/>

        <!-- ETIQUETAS EXACTAS -->
        <text x="165" y="165" font-size="17" font-weight="800" fill="#212529" text-anchor="middle">ESTUDIO AMPLIADO</text>
        <text x="165" y="310" font-size="11" font-weight="700" fill="#495057" text-anchor="middle">PLACARD</text>
        <text x="165" y="388" font-size="15" font-weight="800" fill="#212529" text-anchor="middle">BAÑO AMPLIO</text>
        <text x="315" y="365" font-size="10" font-weight="700" fill="#868e96" text-anchor="middle" transform="rotate(-90 315 365)">PASILLO</text>
        <text x="165" y="480" font-size="11" font-weight="700" fill="#495057" text-anchor="middle">PLACARD</text>
        <text x="165" y="615" font-size="17" font-weight="800" fill="#212529" text-anchor="middle">CUARTO AMPLIADO</text>

        <text x="515" y="270" font-size="21" font-weight="800" fill="#212529" text-anchor="middle">LIVING</text>

        <text x="460" y="610" font-size="16" font-weight="800" fill="#212529" text-anchor="middle">COCINA</text>
        <text x="460" y="630" font-size="10.5" font-weight="500" fill="#495057" text-anchor="middle">(Acceso junto al pasillo)</text>

        <text x="625" y="565" font-size="11" font-weight="800" fill="#212529" text-anchor="middle">ENTRADA</text>
      </svg>
    </div>
  </div>

  <!-- VISTA 3D SINCRONIZADA CON LA MISMA GEOMETRÍA -->
  <div id="container-3d"></div>
  <div class="hint-3d" id="hint-3d">Click izquierdo + arrastrar: rotar • Rueda: zoom • Click derecho: desplazar</div>

  <script>
    let scene, camera, renderer, controls, initialized3D = false;
    const container2D = document.getElementById('container-2d');
    const container3D = document.getElementById('container-3d');
    const hint3D = document.getElementById('hint-3d');

    function init3D() {
      if (initialized3D) return;
      initialized3D = true;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(3.15, 11, 9.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container3D.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(3.15, 0, 3.5);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.75));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
      dirLight.position.set(8, 15, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.7 });
      const floorMainMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.6 });
      const floorBathMat = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, roughness: 0.4 });
      const floorPalierMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });

      function addFloor(x1, z1, x2, z2, mat) {
        const w = x2 - x1, d = z2 - z1;
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set(x1 + w / 2, 0, z1 + d / 2);
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      // Suelos según cajas exactas
      addFloor(0.0, 0.0, 3.0, 2.3, floorMainMat);   // Estudio
      addFloor(0.0, 2.3, 2.3, 2.8, floorMainMat);   // Placard 1
      addFloor(0.0, 2.8, 2.3, 4.0, floorBathMat);   // Baño
      addFloor(0.0, 4.0, 2.3, 4.5, floorMainMat);   // Placard 2
      addFloor(2.3, 2.3, 3.0, 4.5, floorMainMat);   // Pasillo
      addFloor(0.0, 4.5, 3.0, 7.0, floorMainMat);   // Cuarto
      addFloor(3.0, 0.0, 6.3, 4.5, floorMainMat);   // Living
      addFloor(3.0, 4.5, 5.2, 7.0, floorMainMat);   // Cocina
      addFloor(5.2, 4.5, 6.3, 5.7, floorMainMat);   // Entrada
      addFloor(5.2, 5.7, 6.3, 7.0, floorPalierMat); // Palier Edificio

      const H = 2.6, T = 0.12;
      function addWallSeg(x1, z1, x2, z2, h = H, y0 = 0) {
        const len = Math.hypot(x2 - x1, z2 - z1);
        const geo = new THREE.BoxGeometry(len + T, h, T);
        const mesh = new THREE.Mesh(geo, wallMat);
        mesh.position.set((x1 + x2) / 2, y0 + h / 2, (z1 + z2) / 2);
        mesh.rotation.y = -Math.atan2(z2 - z1, x2 - x1);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
      }

      // Perímetro en L
      addWallSeg(0.0, 0.0, 6.3, 0.0);
      addWallSeg(6.3, 0.0, 6.3, 5.7);
      addWallSeg(5.2, 5.7, 5.4, 5.7);
      addWallSeg(6.1, 5.7, 6.3, 5.7);
      addWallSeg(5.2, 5.7, 5.2, 7.0);
      addWallSeg(0.0, 7.0, 5.2, 7.0);
      addWallSeg(0.0, 0.0, 0.0, 7.0);

      // Muros interiores exactos
      addWallSeg(0.0, 2.3, 2.3, 2.3);
      addWallSeg(0.0, 2.8, 2.3, 2.8);
      addWallSeg(0.0, 4.0, 2.3, 4.0);
      addWallSeg(0.0, 4.5, 2.3, 4.5);
      addWallSeg(2.3, 2.3, 2.3, 2.8);
      addWallSeg(2.3, 3.7, 2.3, 4.5);

      // Eje X=3.0 (Muro sólido de 0 a 3.7; abierto de 3.7 a 4.5; sólido de 4.5 a 7.0)
      addWallSeg(3.0, 0.0, 3.0, 3.7);
      addWallSeg(3.0, 4.5, 3.0, 7.0);

      // Cocina frente ciego y lateral
      addWallSeg(3.85, 4.5, 5.2, 4.5);
      addWallSeg(5.2, 4.5, 5.2, 5.7);

      const grid = new THREE.GridHelper(12, 12, 0x334155, 0x1e293b);
      grid.position.set(3.15, -0.02, 3.5);
      scene.add(grid);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      (function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      })();
    }

    function switchView(mode) {
      document.getElementById('btn-2d').classList.toggle('active', mode === '2d');
      document.getElementById('btn-3d').classList.toggle('active', mode === '3d');
      if (mode === '2d') {
        container2D.style.display = 'flex';
        container3D.style.display = 'none';
        hint3D.style.display = 'none';
      } else {
        container2D.style.display = 'none';
        container3D.style.display = 'block';
        hint3D.style.display = 'block';
        init3D();
      }
    }
  </script>
</body>
</html>
